name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        uses: actions/setup-python@v5
        with:
          python-version: 3.15
      - name: Install dependencies
        run: |
          python -m compileall -q src tests
      - name: test
        run: |
          python -m unittest -v 